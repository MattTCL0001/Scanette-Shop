<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scanner Produits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --surface: rgba(30, 41, 59, 0.6);
    --surface-hover: rgba(51, 65, 85, 0.7);
    --primary: #6366f1;
    --primary-glow: rgba(99, 102, 241, 0.5);
    --success: #10b981;
    --danger: #ef4444;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.08);
    --radius: 20px;
    --radius-sm: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    background: 
      radial-gradient(800px 400px at 0% 0%, rgba(99,102,241,0.15), transparent 60%),
      radial-gradient(600px 300px at 100% 10%, rgba(139,92,246,0.1), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .app { 
    max-width: 680px; 
    margin: 0 auto; 
    padding: 16px 16px 160px; 
  }

  .icon { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 4px 20px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .logo {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    display: grid; place-items: center;
    box-shadow: 0 8px 24px var(--primary-glow);
    color: white;
  }
  .brand-text { line-height: 1.2; }
  .brand-text strong { display: block; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
  .brand-text small { display: block; font-weight: 500; color: var(--text-muted); font-size: 0.8rem; }
  
  .icon-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    width: 44px; height: 44px; border-radius: 14px; cursor: pointer;
    display: grid; place-items: center; transition: all 0.2s ease;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn.active { 
    background: rgba(99,102,241,0.15); border-color: var(--primary); color: var(--primary); 
  }

  /* SCANNER */
  #scanner-container {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    cursor: pointer;
  }
  #scanner-container video, #scanner-container canvas {
    position: absolute; top: 0; left: 0;
    width: 100% !important; height: 100% !important; 
    object-fit: cover; display: block; pointer-events: none;
  }

  .viewfinder {
    position: absolute; inset: 0; pointer-events: none;
    display: grid; place-items: center;
  }
  .viewfinder .frame {
    position: relative;
    width: 80%; height: 60%; /* Correspond exactement à l'area de Quagga */
    border-radius: 24px;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(2px);
  }
  .corner {
    position: absolute; width: 28px; height: 28px;
    border-color: var(--primary); border-style: solid; border-width: 0;
    transition: all 0.3s ease;
  }
  .corner.tl { top: -2px; left: -2px; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 24px; }
  .corner.tr { top: -2px; right: -2px; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 24px; }
  .corner.bl { bottom: -2px; left: -2px; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 24px; }
  .corner.br { bottom: -2px; right: -2px; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 24px; }

  .scan-line {
    position: absolute; left: 5%; right: 5%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    box-shadow: 0 0 12px var(--primary), 0 0 4px white;
    animation: scan 2.5s ease-in-out infinite;
    opacity: 0; z-index: 10;
  }
  @keyframes scan {
    0%, 100% { top: 10%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    50% { top: 90%; }
  }

  .scanner-hint {
    text-align: center; margin-top: 14px;
    color: var(--text-muted); font-size: 0.9rem; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .status-dot { 
    width: 8px; height: 8px; border-radius: 50%; background: var(--success); 
    box-shadow: 0 0 0 0 rgba(16,185,129,0.6); animation: pulse 1.6s infinite; 
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.6); }
    70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }

  /* FLASH MSG */
  #flash-msg {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-120%);
    background: linear-gradient(135deg, var(--success), #059669);
    color: white; padding: 14px 24px; border-radius: 999px;
    font-weight: 600; font-size: 0.95rem;
    box-shadow: 0 12px 32px rgba(16,185,129,0.4);
    opacity: 0; pointer-events: none;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
    z-index: 2000; max-width: 90vw; display: flex; align-items: center; gap: 10px;
  }
  #flash-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #flash-msg .icon { width: 20px; height: 20px; stroke-width: 2.5; }

  /* DEV PANEL */
  #dev-panel {
    display: none; background: rgba(2,6,23,0.8); backdrop-filter: blur(12px);
    border: 1px solid var(--border); color: #a7f3d0;
    padding: 16px; margin: 16px 0; border-radius: var(--radius-sm);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.78rem;
    max-height: 200px; overflow-y: auto;
  }
  #dev-panel h4 {
    margin: 0 0 12px; color: var(--text); font-size: 0.75rem; letter-spacing: 0.05em;
    text-transform: uppercase; display: flex; align-items: center; gap: 8px;
  }
  .dev-line { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; }
  .dev-line:last-child { border-bottom: 0; }
  .dev-unknown { color: var(--danger); }
  .dev-tag {
    padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 700;
  }
  .tag-ok { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .tag-ko { background: rgba(245,158,11,0.15); color: #fbbf24; }

  /* LIST */
  .list-header {
    display: flex; align-items: center; justify-content: space-between;
    margin: 28px 0 12px;
  }
  .list-header h2 {
    margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .list-actions { display: flex; align-items: center; gap: 12px; }
  
  .text-btn {
    background: transparent; border: none; color: var(--text-muted);
    font-size: 0.85rem; font-weight: 600; font-family: inherit;
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 8px 12px; border-radius: 10px; transition: all 0.2s;
  }
  .text-btn:hover { background: rgba(239,68,68,0.1); color: var(--danger); }
  .text-btn .icon { width: 16px; height: 16px; }

  .count-badge {
    background: var(--surface); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 999px; font-size: 0.8rem; 
    color: var(--text-muted); font-weight: 600;
  }

  #scan-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: var(--surface); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 16px;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .item.new-scan {
    animation: highlightScan 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes highlightScan {
    0% { background: rgba(99, 102, 241, 0.25); transform: scale(1.02); border-color: var(--primary); }
    100% { background: var(--surface); transform: scale(1); }
  }
  
  .item-name { font-weight: 600; font-size: 1rem; line-height: 1.3; margin-bottom: 4px; }
  .item-meta { color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }
  .item-right { display: flex; align-items: center; gap: 14px; }
  .item-price {
    font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em;
    background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .delete-btn {
    background: rgba(239,68,68,0.1); color: #fca5a5;
    border: 1px solid rgba(239,68,68,0.2);
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    display: grid; place-items: center; transition: all 0.2s ease;
  }
  .delete-btn:hover { background: rgba(239,68,68,0.2); color: #fee2e2; }
  .delete-btn:active { transform: scale(0.92); }
  .delete-btn .icon { width: 18px; height: 18px; }

  /* EMPTY STATE */
  .empty {
    text-align: center; padding: 48px 20px;
    border: 2px dashed var(--border); border-radius: var(--radius);
    background: rgba(255,255,255,0.02); margin-top: 8px;
  }
  .empty-icon {
    width: 64px; height: 64px; margin: 0 auto 16px;
    background: rgba(255,255,255,0.05); border-radius: 50%;
    display: grid; place-items: center;
  }
  .empty .icon { width: 32px; height: 32px; color: var(--text-muted); opacity: 0.6; }
  .empty-title { font-weight: 600; color: var(--text); font-size: 1.05rem; margin-bottom: 6px; }
  .empty-subtitle { font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; }

  /* TOTAL BAR */
  .total-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    transform: translateY(110%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
  }
  .total-bar.show { transform: translateY(0); }
  .total-bar .label { 
    color: var(--text-muted); font-size: 0.85rem; font-weight: 600; 
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px; 
  }
  .total-bar .label .icon { width: 16px; height: 16px; }
  .total-bar .amount {
    font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--primary), #a855f7);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .total-bar .items-count { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
</style>
</head>

<div id="flash-msg">
  <svg class="icon"><use href="#i-check"/></svg>
  <span id="flash-text">Produit ajouté</span>
</div>

<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo"><svg class="icon" style="width:22px;height:22px"><use href="#i-scan"/></svg></div>
      <div class="brand-text">
        <strong>ScanPro</strong>
        <small>Gestion de produits</small>
      </div>
    </div>
    <button id="dev-toggle" class="icon-btn" onclick="toggleDev()" title="Mode développeur" aria-label="Mode développeur">
      <svg class="icon" style="width:20px;height:20px"><use href="#i-settings"/></svg>
    </button>
  </header>

  <div id="scanner-container" onclick="triggerFocus()">
    <div class="viewfinder">
      <div class="frame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scan-line"></div>
      </div>
    </div>
  </div>

  <div class="scanner-hint">
    <span class="status-dot"></span>
    <span id="result">Scanner actif — visez le cadre</span>
  </div>

  <div id="dev-panel">
    <h4><svg class="icon"><use href="#i-terminal"/></svg> Logs de scan</h4>
    <div id="dev-logs"></div>
  </div>

  <div class="list-header">
    <h2><svg class="icon"><use href="#i-cart"/></svg> Panier</h2>
    <div class="list-actions">
      <button class="text-btn" id="clear-btn" onclick="clearCart()" style="display:none;">
        <svg class="icon"><use href="#i-trash"/></svg> Vider
      </button>
      <span class="count-badge" id="count-badge">0 article</span>
    </div>
  </div>
  
  <ul id="scan-list"></ul>
  
  <div id="empty-state" class="empty">
    <div class="empty-icon">
      <svg class="icon"><use href="#i-receipt"/></svg>
    </div>

    <div class="empty-subtitle">Scannez un produit pour l'ajouter ici</div>
  </div>
</div>

<div class="total-bar" id="total-bar">
  <div>
    <div class="label"><svg class="icon"><use href="#i-cart"/></svg> Total à payer</div>
    <div class="items-count" id="total-items">0 article</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<!-- Fallback si Liste.js n'est pas présent pour le test -->
<script>
  if (typeof baseProduits === 'undefined') {
    window.baseProduits = {
      "3017620422003": { nom: "Nutella 400g", prix: 3.99 },
      "3045320003008": { nom: "Coca-Cola 1L", prix: 1.89 },
      "3057640252543": { nom: "Eau Minérale 1.5L", prix: 0.99 },
      "5449000000996": { nom: "Coca-Cola Zero 33cl", prix: 1.29 }
    };
  }
</script>
<script src="Liste.js"></script>
<script>
  let panier = {};
  let lastScannedCode = null;
  let clearTimer = null;
  let devMode = false;

  function initScanner() {
    Quagga.init({
      inputStream: {
        name: "Live", type: "LiveStream",
        target: document.querySelector('#scanner-container'),
        constraints: { 
          facingMode: "environment",
          focusMode: "continuous" 
        }
      },
      locator: {
        patchSize: "medium",
        halfSample: true,
        // Correspond au cadre CSS de 80% largeur et 60% hauteur
        area: { top: "20%", right: "10%", left: "10%", bottom: "20%" }
      },
      decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] },
      locate: true
    }, (err) => { if (!err) Quagga.start(); });
  }
  initScanner();

  function triggerFocus() {
    const track = Quagga.CameraAccess.getActiveTrack();
    if (track && track.getCapabilities().focusMode) {
      track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] })
        .then(() => {
          setTimeout(() => {
            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          }, 1000);
        })
        .catch(() => {});
    }
  }

  function toggleDev() {
    devMode = !devMode;
    document.getElementById('dev-panel').style.display = devMode ? "block" : "none";
    document.getElementById('dev-toggle').classList.toggle('active', devMode);
  }

  function logToDev(code, isKnown) {
    const logs = document.getElementById('dev-logs');
    const time = new Date().toLocaleTimeString('fr-FR');
    const line = document.createElement('div');
    line.className = "dev-line" + (isKnown ? "" : " dev-unknown");
    line.innerHTML = `
      <span>[${time}] <strong>${code}</strong></span>
      <span class="dev-tag ${isKnown ? 'tag-ok' : 'tag-ko'}">${isKnown ? 'OK' : 'INCONNU'}</span>
    `;
    logs.prepend(line);
  }

  Quagga.onProcessed(function(result) {
    let drawingCtx = Quagga.canvas.ctx.overlay,
        drawingCanvas = Quagga.canvas.dom.overlay;
    if (result) {
      drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute("width")), parseInt(drawingCanvas.getAttribute("height")));
      if (result.box) {
        Quagga.ImageDebug.drawPath(result.box, {x: 0, y: 1}, drawingCtx, {color: "#6366f1", lineWidth: 3});
      }
    }
  });

  Quagga.onDetected(function(data) {
    const code = data.codeResult.code;
    if (code === lastScannedCode) { resetClearTimer(); return; }
    
    const isKnown = !!baseProduits[code];
    logToDev(code, isKnown);
    const statusEl = document.getElementById('result');

    if (isKnown) {
      lastScannedCode = code;
      resetClearTimer();
      
      const isNew = !panier[code];
      if (panier[code]) { panier[code].qty += 1; }
      else { panier[code] = { ...baseProduits[code], qty: 1 }; }
      
      showFlash(baseProduits[code].nom, panier[code].qty, false);
      renderList(code);
      statusEl.textContent = "Scanner actif — visez le cadre";
      statusEl.style.color = "var(--text-muted)";
      
      if (navigator.vibrate) navigator.vibrate(60);
    } else {
      statusEl.textContent = `Code inconnu : ${code}`;
      statusEl.style.color = "var(--danger)";
      showFlash("Code produit inconnu", 0, true);
      if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
      
      setTimeout(() => {
        statusEl.textContent = "Scanner actif — visez le cadre";
        statusEl.style.color = "var(--text-muted)";
      }, 2500);
    }
  });

  function resetClearTimer() {
    clearTimeout(clearTimer);
    clearTimer = setTimeout(() => { lastScannedCode = null; }, 1500);
  }

  function showFlash(name, qty = 1, isError = false) {
    const el = document.getElementById('flash-msg');
    const textEl = document.getElementById('flash-text');
    const iconEl = el.querySelector('.icon');
    
    if (isError) {
      el.style.background = "linear-gradient(135deg, var(--danger), #b91c1c)";
      el.style.boxShadow = "0 12px 32px rgba(239,68,68,0.4)";
      iconEl.innerHTML = '<use href="#i-x"/>';
      textEl.textContent = name;
    } else {
      el.style.background = "linear-gradient(135deg, var(--success), #059669)";
      el.style.boxShadow = "0 12px 32px rgba(16,185,129,0.4)";
      iconEl.innerHTML = '<use href="#i-check"/>';
      textEl.textContent = qty > 1 ? `${name} (x${qty})` : name;
    }
    
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.classList.remove('show'); }, isError ? 1500 : 2000);
  }

  function renderList(highlightCode = null) {
    const list = document.getElementById('scan-list');
    const empty = document.getElementById('empty-state');
    const totalBar = document.getElementById('total-bar');
    const clearBtn = document.getElementById('clear-btn');
    
    list.innerHTML = "";
    const codes = Object.keys(panier);
    let total = 0, qtyTotal = 0;

    clearBtn.style.display = codes.length > 0 ? "flex" : "none";

    for (let code of codes) {
      const item = panier[code];
      total += item.prix * item.qty;
      qtyTotal += item.qty;
      
      const li = document.createElement('li');
      li.className = "item" + (code === highlightCode ? " new-scan" : "");
      li.innerHTML = `
        <div style="flex:1; min-width:0;">
          <div class="item-name">${item.nom}</div>
          <div class="item-meta">Qté : ${item.qty} × ${item.prix.toFixed(2)} €</div>
        </div>
        <div class="item-right">
          <span class="item-price">${(item.prix * item.qty).toFixed(2)} €</span>
          <button class="delete-btn" onclick="removeItem('${code}')" title="Supprimer" aria-label="Supprimer">
            <svg class="icon"><use href="#i-trash"/></svg>
          </button>
        </div>`;
      list.prepend(li);
    }

    empty.style.display = codes.length ? 'none' : 'block';
    totalBar.classList.toggle('show', codes.length > 0);
    document.getElementById('total-amount').textContent = total.toFixed(2).replace('.', ',') + ' €';
    document.getElementById('total-items').textContent = qtyTotal + (qtyTotal > 1 ? ' articles' : ' article');
    document.getElementById('count-badge').textContent = qtyTotal + (qtyTotal > 1 ? ' articles' : ' article');
  }

  function removeItem(code) {
    delete panier[code];
    renderList();
    if (navigator.vibrate) navigator.vibrate(40);
  }

  function clearCart() {
    if (Object.keys(panier).length === 0) return;
    if (confirm("Vider l'intégralité du panier ?")) {
      panier = {};
      renderList();
      if (navigator.vibrate) navigator.vibrate(40);
    }
  }
</script>
</body>
</html>
