<style>
    body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 10px; }
    #scanner-container { 
        width: 100%; max-width: 600px; margin: 0 auto; 
        border: 4px solid #333; border-radius: 20px; 
        overflow: hidden; background: #000; position: relative;
    }
    #scanner-container video, #scanner-container canvas { width: 100%; height: auto; display: block; }
    canvas.drawingBuffer { position: absolute; top: 0; left: 0; }
    
    /* PANNEAU DEV AMÉLIORÉ */
    #dev-panel { 
        display: none; background: #222; color: #0f0; 
        padding: 15px; margin: 10px auto; max-width: 600px; 
        border-radius: 12px; font-family: monospace; text-align: left;
        max-height: 200px; overflow-y: auto; font-size: 0.8rem;
    }
    .dev-line { border-bottom: 1px solid #444; padding: 2px 0; }
    .dev-unknown { color: #ffae00; } /* Orange pour les codes inconnus */

    #flash-msg {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        background: #28a745; color: white; padding: 10px 20px;
        border-radius: 30px; display: none; z-index: 2000; font-weight: bold;
    }

    #scan-list { list-style: none; padding: 0; max-width: 600px; margin: 20px auto; }
    .item { background: #1a1a1a; color: white; margin: 10px 0; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
    .item-price { font-weight: bold; font-size: 1.2rem; color: #007bff; }
    .delete-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; }
</style>

<body>
    <div id="flash-msg">Produit ajouté !</div>

    <button onclick="toggleDev()" style="background:#444; color:white; border:none; padding:8px 15px; border-radius:20px; margin: 10px 0;">
        Toggle Mode Dev (Historique)
    </button>

    <div id="dev-panel">
        <strong>Logs de scan :</strong><br>
        <div id="dev-logs"></div>
    </div>

    <div id="scanner-container"></div>
    <p id="result">Scanner actif</p>

    <ul id="scan-list"></ul>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="Liste.js"></script>

    <script>
        let panier = {};
        let lastScannedCode = null;
        let clearTimer = null;
        let devMode = false;

        function initScanner() {
            Quagga.init({
                inputStream: { 
                    name: "Live", type: "LiveStream", 
                    target: document.querySelector('#scanner-container'), 
                    constraints: { facingMode: "environment", focusMode: "continuous" } 
                },
                locate: true,
                decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] },
                locator: { patchSize: "medium", halfSample: true }
            }, (err) => { if (!err) Quagga.start(); });
        }

        initScanner();

        function toggleDev() {
            devMode = !devMode;
            document.getElementById('dev-panel').style.display = devMode ? "block" : "none";
        }

        // Ajoute une ligne dans les logs dev
        function logToDev(code, isKnown) {
            const logs = document.getElementById('dev-logs');
            const now = new Date();
            const time = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0') + ":" + now.getSeconds().toString().padStart(2, '0');
            
            const line = document.createElement('div');
            line.className = "dev-line" + (isKnown ? "" : " dev-unknown");
            line.innerHTML = `[${time}] Code: <strong>${code}</strong> ${isKnown ? "(OK)" : "(INCONNU)"}`;
            
            logs.prepend(line); // Le plus récent en haut
        }

        Quagga.onProcessed(function(result) {
            let drawingCtx = Quagga.canvas.ctx.overlay,
                drawingCanvas = Quagga.canvas.dom.overlay;
            if (result) {
                drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute("width")), parseInt(drawingCanvas.getAttribute("height")));
                if (result.box) {
                    Quagga.ImageDebug.drawPath(result.box, {x: 0, y: 1}, drawingCtx, {color: "#007bff", lineWidth: 3});
                }
            }
        });

        Quagga.onDetected(function(data) {
            const code = data.codeResult.code;

            if (code === lastScannedCode) {
                resetClearTimer();
                return;
            }

            const isKnown = !!baseProduits[code];
            
            // On log TOUS les scans dans la console dev, même inconnus
            logToDev(code, isKnown);

            if (isKnown) {
                lastScannedCode = code;
                resetClearTimer();

                if (panier[code]) { panier[code].qty += 1; } 
                else { panier[code] = { ...baseProduits[code], qty: 1 }; }

                showFlash(baseProduits[code].nom);
                renderList();
                if (navigator.vibrate) navigator.vibrate(100);
            }
        });

        function resetClearTimer() {
            clearTimeout(clearTimer);
            clearTimer = setTimeout(() => { lastScannedCode = null; }, 1500); 
        }

        function showFlash(name) {
            const el = document.getElementById('flash-msg');
            el.innerText = "✓ " + name;
            el.style.display = "block";
            setTimeout(() => { el.style.display = "none"; }, 1500);
        }

        function renderList() {
            const list = document.getElementById('scan-list');
            list.innerHTML = "";
            for (let code in panier) {
                const item = panier[code];
                const li = document.createElement('li');
                li.className = "item";
                li.innerHTML = `
                    <div><b>${item.nom}</b><br><small>Qté: ${item.qty}</small></div>
                    <div style="display:flex; align-items:center;">
                        <span class="item-price">${(item.prix * item.qty).toFixed(2)}€</span>
                        <button class="delete-btn" onclick="removeItem('${code}')">🗑️</button>
                    </div>`;
                list.prepend(li);
            }
        }

        function removeItem(code) {
            delete panier[code];
            renderList();
        }
    </script>
</body>
