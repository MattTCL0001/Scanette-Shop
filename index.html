<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scanner Produits</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --success: #10b981;
    --danger: #ef4444;
    --warn: #f59e0b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --card: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.1);
  }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.25), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(139,92,246,.2), transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
  }
  .app { max-width: 680px; margin: 0 auto; padding: 16px 14px 120px; }

  .icon { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 4px 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.05rem; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(99,102,241,.45);
    color: white; font-size: 1.2rem;
  }
  .brand-text { line-height: 1.15; }
  .brand-text small { display:block; font-weight: 400; color: var(--muted); font-size: .72rem; margin-top: 2px; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
    display: grid; place-items: center; font-size: 1.1rem;
    transition: transform .15s ease, background .2s;
  }
  .icon-btn:hover { background: rgba(255,255,255,.1); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }

  /* SCANNER */
  #scanner-container {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  #scanner-container video, #scanner-container canvas {
    width: 100% !important; height: 100% !important; object-fit: cover; display: block;
  }
  canvas.drawingBuffer { position: absolute; top: 0; left: 0; }

  .viewfinder {
    position: absolute; inset: 0; pointer-events: none;
    display: grid; place-items: center;
  }
  .viewfinder .frame {
    width: 78%; height: 38%;
    border-radius: 16px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.35);
    position: relative;
  }
  .viewfinder .frame::before,
  .viewfinder .frame::after,
  .viewfinder .frame > i::before,
  .viewfinder .frame > i::after {
    content: ""; position: absolute; width: 26px; height: 26px;
    border: 3px solid #fff; border-radius: 4px;
  }
  .viewfinder .frame::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .viewfinder .frame::after { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .viewfinder .frame > i::before { content:""; bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .viewfinder .frame > i::after { content:""; bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .status {
    margin: 12px 4px 4px;
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: .9rem;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 0 rgba(16,185,129,.6); animation: pulse 1.6s infinite; flex-shrink: 0; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,.6); }
    70% { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }

  /* FLASH */
  #flash-msg {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: linear-gradient(135deg, var(--success), #059669);
    color: white; padding: 12px 22px;
    border-radius: 999px; font-weight: 600;
    box-shadow: 0 12px 32px rgba(16,185,129,.45);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 2000; max-width: 90vw;
    display: flex; align-items: center; gap: 8px;
    font-size: 1rem;
  }
  #flash-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #flash-msg .icon { width: 18px; height: 18px; stroke-width: 2.5; }

  /* DEV PANEL */
  #dev-panel {
    display: none;
    background: rgba(2,6,23,.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    color: #a7f3d0;
    padding: 14px; margin: 14px 0;
    border-radius: 16px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: .8rem;
    max-height: 220px; overflow-y: auto;
  }
  #dev-panel h4 {
    margin: 0 0 10px; color: var(--text); font-size: .8rem;
    letter-spacing: .8px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  #dev-panel h4 .icon { width: 14px; height: 14px; }
  .dev-line { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .dev-line:last-child { border-bottom: 0; }
  .dev-unknown { color: var(--warn); }
  .dev-tag {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: .7rem; margin-left: 6px; font-weight: 600;
  }
  .tag-ok { background: rgba(16,185,129,.2); color: #6ee7b7; }
  .tag-ko { background: rgba(245,158,11,.2); color: #fbbf24; }

  /* LIST */
  .list-header {
    display: flex; align-items: center; justify-content: space-between;
    margin: 22px 4px 10px;
  }
  .list-header h2 {
    margin: 0; font-size: 1.05rem; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .list-header h2 .icon { width: 18px; height: 18px; color: var(--muted); }
  .count-badge {
    background: var(--card); border: 1px solid var(--border);
    padding: 4px 12px; border-radius: 999px; font-size: .78rem; color: var(--muted);
  }

  #scan-list { list-style: none; padding: 0; margin: 0; }
  .item {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    margin: 10px 0; padding: 14px 16px;
    border-radius: 16px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    animation: slideIn .25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .item-name { font-weight: 600; font-size: 1rem; line-height: 1.25; }
  .item-meta { color: var(--muted); font-size: .8rem; margin-top: 3px; }
  .item-right { display: flex; align-items: center; gap: 10px; }
  .item-price {
    font-weight: 700; font-size: 1.05rem;
    background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .delete-btn {
    background: rgba(239,68,68,.12); color: #fca5a5;
    border: 1px solid rgba(239,68,68,.25);
    width: 36px; height: 36px; border-radius: 10px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: background .2s, transform .15s;
  }
  .delete-btn .icon { width: 16px; height: 16px; }
  .delete-btn:hover { background: rgba(239,68,68,.22); }
  .delete-btn:active { transform: scale(.92); }

  .empty {
    text-align: center; padding: 32px 20px;
    color: var(--muted); font-size: .9rem;
    border: 1px dashed var(--border); border-radius: 16px;
  }
  .empty .icon { width: 38px; height: 38px; margin-bottom: 10px; color: var(--muted); opacity: .7; }

  /* TOTAL BAR */
  .total-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: rgba(15,23,42,.85);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    transform: translateY(110%); transition: transform .3s ease;
    z-index: 100;
  }
  .total-bar.show { transform: translateY(0); }
  .total-bar .label { color: var(--muted); font-size: .8rem; display: flex; align-items: center; gap: 6px; }
  .total-bar .label .icon { width: 14px; height: 14px; }
  .total-bar .amount {
    font-size: 1.6rem; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .total-bar .items-count { font-size: .78rem; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>

<!-- Sprite SVG : icônes type Lucide -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8"/><path d="M11 8v8"/><path d="M15 8v8"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M4 2v20l2-2 2 2 2-2 2 2 2-2 2 2 2-2 2 2V2l-2 2-2-2-2 2-2-2-2 2-2-2-2 2-2-2z"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/></symbol>
  </defs>
</svg>

<div id="flash-msg">
  <svg class="icon"><use href="#i-check"/></svg>
  <span id="flash-text">Produit ajouté</span>
</div>

<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo"><svg class="icon" style="width:20px;height:20px"><use href="#i-scan"/></svg></div>
      <div class="brand-text">Scanner<small>Gestion de produits</small></div>
    </div>
    <button id="dev-toggle" class="icon-btn" onclick="toggleDev()" title="Mode développeur" aria-label="Mode développeur">
      <svg class="icon" style="width:18px;height:18px"><use href="#i-settings"/></svg>
    </button>
  </header>

  <div id="scanner-container">
    <div class="viewfinder"><div class="frame"><i></i></div></div>
  </div>

  <div class="status">
    <span class="dot"></span>
    <span id="result">Scanner actif — visez un code-barres</span>
  </div>

  <div id="dev-panel">
    <h4><svg class="icon"><use href="#i-terminal"/></svg> Logs de scan</h4>
    <div id="dev-logs"></div>
  </div>

  <div class="list-header">
    <h2><svg class="icon"><use href="#i-cart"/></svg> Panier</h2>
    <span class="count-badge" id="count-badge">0 article</span>
  </div>
  <ul id="scan-list"></ul>
  <div id="empty-state" class="empty">
    <svg class="icon"><use href="#i-receipt"/></svg>
    <div>Aucun produit scanné pour le moment</div>
  </div>
</div>

<div class="total-bar" id="total-bar">
  <div>
    <div class="label"><svg class="icon"><use href="#i-cart"/></svg> Total</div>
    <div class="items-count" id="total-items">0 article</div>
  </div>
  <div class="amount" id="total-amount">0,00 €</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="Liste.js"></script>
<script>
  let panier = {};
  let lastScannedCode = null;
  let clearTimer = null;
  let devMode = false;

  function initScanner() {
  Quagga.init({
    inputStream: {
      name: "Live", type: "LiveStream",
      target: document.querySelector('#scanner-container'),
      constraints: { 
        facingMode: "environment",
        // Note: focusMode est souvent ignoré par les navigateurs sur mobile
        // mais c'est une bonne pratique de le garder
        focusMode: "continuous" 
      }
    },
    locator: {
      patchSize: "medium",
      halfSample: true,
      // Définit la zone de recherche : [top, left, bottom, right]
      // Ici, on prend les 20% du haut, 10% de gauche, 20% du bas, 10% de droite.
      // Cela crée une "fenêtre" centrale.
      area: { top: "20%", right: "10%", left: "10%", bottom: "20%" }
    },
    decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] },
    locate: true
  }, (err) => { if (!err) Quagga.start(); });
}
  initScanner();
 // 1. Ajoute cet écouteur d'événement après ton initScanner()
document.getElementById('scanner-container').addEventListener('click', function() {
  console.log("Tentative de refaire le focus...");
  
  // On récupère le flux vidéo actif
  const track = Quagga.CameraAccess.getActiveTrack();
  if (track && track.getCapabilities().focusMode) {
    // Si le matériel le permet, on envoie une contrainte de mise au point
    track.applyConstraints({
      advanced: [{ focusMode: 'single-shot' }]
    }).then(() => {
      // On repasse en continu après le "shot" pour rester net
      setTimeout(() => {
        track.applyConstraints({
          advanced: [{ focusMode: 'continuous' }]
        });
      }, 1000);
    }).catch(err => console.error("Le focus manuel n'est pas supporté", err));
  }
});

  function toggleDev() {
    devMode = !devMode;
    document.getElementById('dev-panel').style.display = devMode ? "block" : "none";
    document.getElementById('dev-toggle').classList.toggle('active', devMode);
  }

  function logToDev(code, isKnown) {
    const logs = document.getElementById('dev-logs');
    const time = new Date().toLocaleTimeString('fr-FR');
    const line = document.createElement('div');
    line.className = "dev-line" + (isKnown ? "" : " dev-unknown");
    line.innerHTML = `[${time}] <strong>${code}</strong>
      <span class="dev-tag ${isKnown ? 'tag-ok' : 'tag-ko'}">${isKnown ? 'OK' : 'INCONNU'}</span>`;
    logs.prepend(line);
  }

  Quagga.onProcessed(function(result) {
    let drawingCtx = Quagga.canvas.ctx.overlay,
        drawingCanvas = Quagga.canvas.dom.overlay;
    if (result) {
      drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute("width")), parseInt(drawingCanvas.getAttribute("height")));
      if (result.box) {
        Quagga.ImageDebug.drawPath(result.box, {x: 0, y: 1}, drawingCtx, {color: "#6366f1", lineWidth: 3});
      }
    }
  });

  Quagga.onDetected(function(data) {
    const code = data.codeResult.code;
    if (code === lastScannedCode) { resetClearTimer(); return; }
    const isKnown = !!baseProduits[code];
    logToDev(code, isKnown);
    if (isKnown) {
      lastScannedCode = code;
      resetClearTimer();
      if (panier[code]) { panier[code].qty += 1; }
      else { panier[code] = { ...baseProduits[code], qty: 1 }; }
      showFlash(baseProduits[code].nom);
      renderList();
      if (navigator.vibrate) navigator.vibrate(80);
    }
  });

  function resetClearTimer() {
    clearTimeout(clearTimer);
    clearTimer = setTimeout(() => { lastScannedCode = null; }, 1500);
  }

  function showFlash(name) {
    const el = document.getElementById('flash-msg');
    document.getElementById('flash-text').textContent = name;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.classList.remove('show'); }, 1500);
  }

  function renderList() {
    const list = document.getElementById('scan-list');
    const empty = document.getElementById('empty-state');
    const totalBar = document.getElementById('total-bar');
    list.innerHTML = "";

    const codes = Object.keys(panier);
    let total = 0, qtyTotal = 0;

    for (let code of codes) {
      const item = panier[code];
      total += item.prix * item.qty;
      qtyTotal += item.qty;
      const li = document.createElement('li');
      li.className = "item";
      li.innerHTML = `
        <div>
          <div class="item-name">${item.nom}</div>
          <div class="item-meta">Qté : ${item.qty} × ${item.prix.toFixed(2)} €</div>
        </div>
        <div class="item-right">
          <span class="item-price">${(item.prix * item.qty).toFixed(2)} €</span>
          <button class="delete-btn" onclick="removeItem('${code}')" title="Supprimer" aria-label="Supprimer">
            <svg class="icon"><use href="#i-trash"/></svg>
          </button>
        </div>`;
      list.prepend(li);
    }

    empty.style.display = codes.length ? 'none' : 'block';
    totalBar.classList.toggle('show', codes.length > 0);
    document.getElementById('total-amount').textContent = total.toFixed(2).replace('.', ',') + ' €';
    document.getElementById('total-items').textContent = qtyTotal + (qtyTotal > 1 ? ' articles' : ' article');
    document.getElementById('count-badge').textContent = qtyTotal + (qtyTotal > 1 ? ' articles' : ' article');
  }

  function removeItem(code) {
    delete panier[code];
    renderList();
  }
 
</script>
</body>
</html>
